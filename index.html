<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Society Maintenance Checker</title>
    <style>
        :root {
            --primary: #1b4332;
            --primary-light: #2d6a4f;
            --accent: #52b788;
            --bg: #f8f9fa;
            --card-bg: #ffffff;
            --text: #212529;
            --border: #ced4da;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 600px;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            margin-top: 20px;
        }
        h2 { color: var(--primary); margin-top: 0; text-align: center; }
        .search-container {
            position: relative;
            margin-bottom: 25px;
        }
        input[type="text"] {
            width: 100%;
            padding: 14px 18px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 16px;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s;
        }
        input[type="text"]:focus {
            border-color: var(--primary);
        }
        .autocomplete-list {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: white;
            border: 1px solid var(--border);
            border-top: none;
            border-radius: 0 0 8px 8px;
            max-height: 220px;
            overflow-y: auto;
            z-index: 1000;
            box-shadow: 0 6px 12px rgba(0,0,0,0.1);
        }
        .autocomplete-item {
            padding: 12px 18px;
            cursor: pointer;
            border-bottom: 1px solid #f1f3f5;
        }
        .autocomplete-item:hover {
            background-color: #e9f5ed;
            color: var(--primary);
            font-weight: 500;
        }
        #loading {
            text-align: center;
            color: #6c757d;
            font-style: italic;
            margin: 20px 0;
        }
        .result-card {
            background: #f8f9fa;
            border-top: 4px solid var(--accent);
            padding: 25px;
            border-radius: 8px;
            margin-top: 20px;
            display: none;
        }
        .result-card h3 { margin: 0 0 15px 0; color: var(--primary); border-bottom: 1px solid #dee2e6; padding-bottom: 10px; }
        .info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        .info-box {
            background: white;
            padding: 14px 16px;
            border-radius: 6px;
            border: 1px solid #e9ecef;
        }
        .info-box.full-width {
            grid-column: span 2;
        }
        .info-label { font-size: 13px; color: #6c757d; margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.5px; }
        .info-value { font-size: 18px; font-weight: 600; color: var(--text); }
        .badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
        }
        .badge-yes { background: #fff3cd; color: #856404; }
        .badge-no { background: #d4edda; color: #155724; }
    </style>
</head>
<body>

<div class="container">
    <h2>Pushpvihar Society Maintenance</h2>
    
    <div class="search-container">
        <input type="text" id="searchInput" placeholder="Search by House No or Name..." oninput="filterRecords()" autocomplete="off">
        <div id="autocompleteList" class="autocomplete-list" style="display: none;"></div>
    </div>

    <div id="loading">Loading records from Google Sheet...</div>

    <div id="resultCard" class="result-card">
        <h3 id="resTitle"></h3>
        <div class="info-grid">
            <div class="info-box">
                <div class="info-label">Occupancy Type</div>
                <div class="info-value" id="resIsRented">-</div>
            </div>
            <div class="info-box">
                <div class="info-label">Cleared Till</div>
                <div class="info-value" id="resClearedTill" style="color: var(--primary-light);">-</div>
            </div>
            <div class="info-box">
                <div class="info-label">Amount Remaining</div>
                <div class="info-value" id="resRemaining" style="color: #d90429;">₹0</div>
            </div>
        </div>
    </div>
</div>

<script>
    const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbzqFVrqBNxt1ttQszvEVe_FGihfPbQHXDfnOjT91C9EhXm68QoivnXAgIA7oYKznP2L/exec';  // Replace with your Apps Script Web App URL
    let allRecords = [];

    window.onload = function() {
        loadSheetData();
    };

    async function loadSheetData() {
        try {
            const response = await fetch(WEB_APP_URL);
            const data = await response.json();
            allRecords = data.records;
            document.getElementById('loading').style.display = 'none';
        } catch (e) {
            console.error(e);
            document.getElementById('loading').innerText = 'Failed to load data from Google Sheet.';
        }
    }

    function filterRecords() {
        const query = document.getElementById('searchInput').value.toLowerCase().trim();
        const listDiv = document.getElementById('autocompleteList');
        listDiv.innerHTML = '';

        if (!query) {
            listDiv.style.display = 'none';
            return;
        }

        const filtered = allRecords.filter(r => 
            String(r.houseNo).toLowerCase().includes(query) || 
            r.name.toLowerCase().includes(query)
        );

        if (filtered.length === 0) {
            listDiv.style.display = 'none';
            return;
        }

        filtered.forEach(record => {
            const div = document.createElement('div');
            div.className = 'autocomplete-item';
            // Display format: [house no] - [name]
            div.innerText = `${record.houseNo} - ${record.name}`;
            div.onclick = () => selectRecord(record);
            listDiv.appendChild(div);
        });

        listDiv.style.display = 'block';
    }

    function selectRecord(record) {
        document.getElementById('searchInput').value = `${record.houseNo} - ${record.name}`;
        document.getElementById('autocompleteList').style.display = 'none';
        displayRecordDetails(record);
    }

    function displayRecordDetails(record) {
        document.getElementById('resultCard').style.display = 'block';
        document.getElementById('resTitle').innerText = `House #${record.houseNo} — ${record.name}`;

        const rentedBox = document.getElementById('resIsRented');
        const isRentedLower = String(record.isRented).toLowerCase();
        rentedBox.innerHTML = `<span class="badge badge-no">${String(record.isRented)}</span>`

        document.getElementById('resClearedTill').innerText = record.clearedTill;
        document.getElementById('resRemaining').innerText = `₹${record.amountRemaining}`;
    }

    // Close autocomplete dropdown when clicking outside
    document.addEventListener('click', function(e) {
        if (!e.target.closest('.search-container')) {
            document.getElementById('autocompleteList').style.display = 'none';
        }
    });
</script>

</body>
</html>
